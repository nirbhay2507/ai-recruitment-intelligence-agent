<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitIntel AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .candidate-box {
            border: 1px solid #e2e8f0;
            padding: 18px;
            margin-top: 20px;
            border-radius: 10px;
            background: #f8fafc;
        }

        button {
            margin-top: 20px;
            padding: 13px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .analyze {
            width: 100%;
            font-size: 18px;
            background: #16a34a;
        }

        .analyze:hover {
            background: #15803d;
        }

        #loading {
            display: none;
            margin-top: 15px;
            color: #2563eb;
            font-weight: bold;
        }

        .candidate-result {
            border-left: 6px solid #2563eb;
            padding: 18px;
            margin: 15px 0;
            background: #f8fafc;
            border-radius: 8px;
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
            color: #16a34a;
            margin: 8px 0;
        }

        .skill {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 5px 9px;
            margin: 3px;
            border-radius: 5px;
            font-size: 13px;
        }

        .missing {
            background: #fee2e2;
            color: #991b1b;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>RecruitIntel AI</h1>
    <p>AI Recruitment Intelligence Agent</p>
</header>

<div class="container">

    <!-- JOB -->
    <div class="card">

        <h2>Job Description</h2>

        <label>Job Title</label>
        <input id="jobTitle" value="Python Backend Developer">

        <label>Job Description</label>
        <textarea id="jobDescription" rows="4">Looking for a Python backend developer with FastAPI, SQL, PostgreSQL, Docker and AWS skills.</textarea>

    </div>


    <!-- CANDIDATE 1 -->
    <div class="card candidate-box">

        <h2>Candidate 1</h2>

        <label>Name</label>
        <input id="name1" value="Rahul Sharma">

        <label>Resume</label>
        <textarea id="resume1" rows="4">Python developer with 3 years of experience in Python, FastAPI, SQL, PostgreSQL, Docker and AWS. Experienced in building REST APIs and backend applications.</textarea>

    </div>


    <!-- CANDIDATE 2 -->
    <div class="card candidate-box">

        <h2>Candidate 2</h2>

        <label>Name</label>
        <input id="name2" value="Priya Patil">

        <label>Resume</label>
        <textarea id="resume2" rows="4">Backend developer with 2 years of experience in Python, FastAPI, SQL and PostgreSQL. Experienced in REST API development and database management.</textarea>

    </div>


    <!-- CANDIDATE 3 -->
    <div class="card candidate-box">

        <h2>Candidate 3</h2>

        <label>Name</label>
        <input id="name3" value="Amit Verma">

        <label>Resume</label>
        <textarea id="resume3" rows="4">Software developer with 1 year of experience in Python, JavaScript and SQL. Worked on web applications and basic API development.</textarea>

    </div>


    <!-- CANDIDATE 4 -->
    <div class="card candidate-box">

        <h2>Candidate 4</h2>

        <label>Name</label>
        <input id="name4" value="Sneha Kulkarni">

        <label>Resume</label>
        <textarea id="resume4" rows="4">Python developer with 4 years of experience in Python, FastAPI, SQL, PostgreSQL, Docker, AWS and Git. Strong backend development experience.</textarea>

    </div>


    <!-- CANDIDATE 5 -->
    <div class="card candidate-box">

        <h2>Candidate 5</h2>

        <label>Name</label>
        <input id="name5" value="Vikas Singh">

        <label>Resume</label>
        <textarea id="resume5" rows="4">Frontend developer with 2 years of experience in HTML, CSS, JavaScript and React. Experience building responsive web applications.</textarea>

    </div>


    <!-- ANALYZE -->
    <div class="card">

        <button class="analyze" onclick="recruit()">
            Analyze & Rank 5 Candidates
        </button>

        <div id="loading">
            Analyzing candidates...
        </div>

    </div>


    <!-- RESULTS -->
    <div class="card">

        <h2>Recruitment Results</h2>

        <div id="results">
            Results will appear here.
        </div>

    </div>

</div>


<script>

async function recruit() {

    const loading = document.getElementById("loading");
    const results = document.getElementById("results");

    loading.style.display = "block";

    results.innerHTML = "Analyzing...";


    const candidates = [];


    // Collect all 5 candidates
    for (let i = 1; i <= 5; i++) {

        candidates.push({

            name: document.getElementById(
                "name" + i
            ).value,

            resume: document.getElementById(
                "resume" + i
            ).value

        });

    }


    const data = {

        job: {

            title: document.getElementById(
                "jobTitle"
            ).value,

            description: document.getElementById(
                "jobDescription"
            ).value

        },

        candidates: candidates

    };


    try {

        const response = await fetch(
            "/recruit",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const result = await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Recruitment request failed"
            );

        }


        let html = `

            <h3>
                Job: ${result.job}
            </h3>

            <p>
                Total Candidates:
                <b>${result.total_candidates}</b>
            </p>

            <hr>

        `;


        result.ranked_candidates.forEach(
            (candidate, index) => {

                const score =
                    candidate.match_score ??
                    candidate.score ??
                    0;


                const matched =
                    candidate.matched_skills || [];


                const missing =
                    candidate.missing_skills || [];


                html += `

                    <div class="candidate-result">

                        <div class="rank">
                            #${index + 1}
                            ${candidate.name}
                        </div>

                        <div class="score">
                            ${Number(score).toFixed(2)}%
                        </div>

                        <p>
                            <b>Recommendation:</b>
                            ${candidate.recommendation || "N/A"}
                        </p>

                        <p>
                            <b>Experience:</b>
                            ${candidate.experience_years || 0}
                            years
                        </p>

                        <p>
                            <b>Matched Skills:</b>
                        </p>

                        <div>
                            ${
                                matched.length
                                ? matched.map(
                                    skill =>
                                    `<span class="skill">✓ ${skill}</span>`
                                  ).join("")
                                : "None"
                            }
                        </div>

                        <p>
                            <b>Missing Skills:</b>
                        </p>

                        <div>
                            ${
                                missing.length
                                ? missing.map(
                                    skill =>
                                    `<span class="skill missing">✗ ${skill}</span>`
                                  ).join("")
                                : "None"
                            }
                        </div>

                    </div>

                `;

            }
        );


        results.innerHTML = html;


    } catch (error) {

        results.innerHTML = `

            <p class="error">
                Error: ${error.message}
            </p>

        `;

    }


    loading.style.display = "none";

}

</script>

</body>
</html>
